name: Publish plugins
on:
  push:
    tags: ['v*', '*/v*']
permissions:
  contents: read
concurrency:
  group: jietuma-plugins-tagged-release
  cancel-in-progress: false

jobs:
  build:
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_check_release_version.py
      - run: python -m unittest discover -s scripts -p test_actions_retention.py
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py $env:RELEASE_TAG --github-output $env:GITHUB_OUTPUT
      - run: cargo test --locked
      - name: Package selected plugins
        env:
          RELEASE_PLUGIN: ${{ steps.version.outputs.plugin }}
        run: |
          if ($env:RELEASE_PLUGIN) { python scripts/package.py --plugin $env:RELEASE_PLUGIN }
          else { python scripts/package.py }
      - uses: actions/upload-artifact@v4
        with:
          name: jietuma-plugins-windows-x64
          path: ${{ steps.version.outputs.assets }}
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jietuma-plugins-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jtbplugin
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

  cleanup:
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep three successful and three failed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/actions_retention.py --keep 3
